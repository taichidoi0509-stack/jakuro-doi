<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a3f2d">
  <meta name="application-name" content="森研麻雀倶楽部">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="森研麻雀倶楽部">
  <title>森研麻雀倶楽部</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./style.css?v=72">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand" aria-label="森研麻雀倶楽部">
        <div class="brand-icon" aria-hidden="true"><img src="./icons/icon.svg" alt=""></div>
        <div>
          <p class="brand-label">対局記録・成績・精算</p>
          <h1>森研麻雀倶楽部</h1>
        </div>
      </div>
    </header>

    <main class="main-content">
      <section class="hero-card">
        <p class="eyebrow">森研麻雀倶楽部</p>
        <h2>対局を記録する</h2>
        <p>ログインして、対局の記録と精算を始めましょう。</p>
        <div class="hero-status"><span class="status-dot"></span>ログイン状態を確認しています</div>
      </section>

      <section class="section-block"><p class="signin-help">グループに参加して、対局の記録と精算を共有できます。</p></section>
    </main>

    <nav class="bottom-nav" aria-label="メインナビゲーション">
      <button type="button" class="nav-item active" data-tab="home"><span>⌂</span><small>ホーム</small></button>
      <button type="button" class="nav-item" data-tab="game"><span>対</span><small>対局</small></button>
      <button type="button" class="nav-item" data-tab="ranking"><span>分</span><small>分析</small></button>
      <button type="button" class="nav-item" data-tab="debt"><span>精</span><small>精算</small></button>
      <button type="button" class="nav-item" data-tab="settings"><span>⚙</span><small>設定</small></button>
    </nav>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="./scoring-rules.js?v=72"></script>
  <script src="./app.js?v=72"></script>
</body>
</html>
